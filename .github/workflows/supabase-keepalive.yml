# Copied into moharem/dorak-demo by deploy-pages.sh. Free Supabase projects
# pause after a week without use, which breaks the live two-phone demo, so this
# calls the project twice a week.
name: Supabase keepalive

on:
  schedule:
    - cron: '17 6 * * 1,4' # Mondays and Thursdays, 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call keepalive()
        # The publishable key is public by design; it already ships in the demo.
        run: |
          curl -fsS -X POST \
            -H "apikey: sb_publishable_F5tRMAL1dzKkdAtCv0hdoA_xyhXOjYg" \
            -H "Content-Type: application/json" \
            -d '{}' \
            https://wikixlsqtkgxuafwmdcx.supabase.co/rest/v1/rpc/keepalive
